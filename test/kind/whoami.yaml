apiVersion: v1
kind: Namespace
metadata:
  name: cryptos-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: cryptos-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: WHOAMI_IMAGE
          args: ["--port", "8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: cryptos-e2e
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: cryptos-e2e
spec:
  ingressClassName: contour
  tls:
    - hosts: [E2E_HOSTNAME]
      secretName: whoami-tls
  rules:
    - host: E2E_HOSTNAME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
