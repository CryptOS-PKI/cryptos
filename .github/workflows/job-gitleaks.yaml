name: Gitleaks
# Secret scan on EVERY push and PR -- no paths-ignore, because a secret can land
# in any file, docs included. Hard failure: the scan exits non-zero on a finding.
#
# Runs the gitleaks CLI directly rather than gitleaks/gitleaks-action@v2: that
# action requires a paid GITLEAKS_LICENSE for organization-owned repos, while the
# CLI is free everywhere. This matches the `gitleaks detect` the repos already
# run locally via `task lint`.
on:
  # push stays on every branch: this is the only secret scan, and a branch
  # can be pushed long before it has a PR against main.
  push:
  pull_request:
    branches: [main]
    # edited is here so retargeting a stacked PR onto main starts CI. Jobs
    # skip edited events that did not change the base (title/body edits).
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
# One run per PR per workflow: a new push cancels the older PR run. Pushes to
# main are never cancelled, so every main commit keeps a result. A title or
# body edit gets its own group, so its run never cancels real CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && github.event.changes.base == null && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gitleaks:
    name: 🔒 Gitleaks (secret scan)${{ github.event.action == 'edited' && github.event.changes.base == null && ' (edit, not run)' || '' }}
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION="8.30.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run Gitleaks
        run: |
          # Honor a repo-local .gitleaks.toml if present; scan the full tree.
          config_arg=""
          [ -f .gitleaks.toml ] && config_arg="--config .gitleaks.toml"
          gitleaks detect --source . --redact --verbose --no-banner $config_arg
