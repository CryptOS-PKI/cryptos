name: GoLic
# Verify every source file carries the MIT license header. golic (Bugs5382's own
# tool) is run through go-task (`task license`) -- the standard runner for every
# project. `golic inject --dry -x` fails the check if a header is missing; it never
# modifies files. Docs (**.md) are skipped -- they carry no header.
on:
  pull_request:
    branches: [main]
    # edited is here so retargeting a stacked PR onto main starts CI. Jobs
    # skip edited events that did not change the base (title/body edits).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths-ignore: ['**.md']
# One run per PR per workflow: a new push cancels the older PR run. Pushes to
# main are never cancelled, so every main commit keeps a result. A title or
# body edit gets its own group, so its run never cancels real CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && github.event.changes.base == null && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  golic:
    name: 🔏 License headers${{ github.event.action == 'edited' && github.event.changes.base == null && ' (edit, not run)' || '' }}
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          # Pin an exact, existing go-task version. setup-task's `3.x` range
          # resolution mis-computes a nonexistent version (observed: v3.52.0 ->
          # 404 on download; latest real is v3.51.1), breaking the check on every
          # PR. Pinning skips the broken lookup entirely; bump deliberately.
          version: 3.51.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify MIT headers
        run: |
          export PATH="${PATH}:$(go env GOPATH)/bin"
          task license
