name: Go CI (format, lint, vet, test, build)

# Go validation on a GitHub-hosted Linux runner. Mirrors `task ci`
# (fmt + lint + vet + test + build). Runs on PRs and pushes to main.

# Skip when a change touches only non-Go files (Markdown, docs, the image
# build scripts, or issue templates). A mixed change still runs, since
# paths-ignore only skips when every changed file matches.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "build/**"
  pull_request:
    branches: [main]
    # edited is here so retargeting a stacked PR onto main starts CI. Jobs
    # skip edited events that did not change the base (title/body edits).
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "build/**"

permissions:
  contents: read

# One run per PR per workflow: a new push cancels the older PR run. Pushes to
# main are never cancelled, so every main commit keeps a result. A title or
# body edit gets its own group, so its run never cancels real CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && github.event.changes.base == null && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-validation:
    name: Go validation (format, lint, vet, test, build)${{ github.event.action == 'edited' && github.event.changes.base == null && ' (edit, not run)' || '' }}
    if: github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install golangci-lint
        # Built from source with this job's Go (>= the go.mod version) so its
        # analyzers can load code that requires that Go; a prebuilt binary
        # built with an older Go panics on newer language/std usage.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install swtpm
        # The TPM-held RSA CA end-to-end test needs a TPM that implements
        # RSA-3072. The in-process simulator stops at RSA-2048, and the test
        # fails rather than skips under CI when swtpm is missing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swtpm

      - name: Build sscep for the SCEP interoperability tests
        # internal/scep runs a real SCEP client against the server and fails
        # under CI when it has none. Built from the pinned release tarball,
        # checksum-checked, since no prebuilt binary is published.
        env:
          SSCEP_VERSION: 0.10.0
          SSCEP_SHA256: 489cc8e093986776eb3f15082bf766778f707176f3cd604bf0ef1008da06b8e5
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o sscep.tar.gz "https://github.com/certnanny/sscep/archive/refs/tags/v${SSCEP_VERSION}.tar.gz"
          echo "${SSCEP_SHA256}  sscep.tar.gz" | sha256sum -c -
          tar xzf sscep.tar.gz
          cmake -S "sscep-${SSCEP_VERSION}" -B sscep-build -DCMAKE_BUILD_TYPE=Release
          cmake --build sscep-build
          echo "CRYPTOS_TEST_SSCEP=$RUNNER_TEMP/sscep-build/sscep" >> "$GITHUB_ENV"

      - name: Run task ci
        run: task ci

      - name: Check tree is clean
        run: git diff --exit-code
